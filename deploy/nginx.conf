# Статика мини-аппа. TLS, домен и маршрутизация /api/* — на host-Caddy (ADR-0003):
# внутрь контейнера приходит только plain HTTP с loopback.

# Cache-Control считается здесь, а не в location. Причина: nginx устроен так, что
# ЛЮБОЙ add_header внутри location отменяет ВСЕ унаследованные add_header. Пока
# кэш-заголовок жил в `location = /index.html`, страница игры молча отдавалась
# вообще без CSP — поймано дымовым запуском образа.
map $uri $corpfly_cache_control {
    default      "public, max-age=300, must-revalidate";
    ~*\.html$    "no-cache, must-revalidate";
}

server {
    listen       8080;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    server_tokens off;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;
    gzip_min_length 512;

    # Единственный уровень add_header во всём конфиге — см. комментарий к map выше.
    add_header Cache-Control $corpfly_cache_control always;
    # X-Frame-Options здесь НЕТ намеренно: Telegram Web открывает мини-апп в iframe,
    # и DENY убил бы веб-клиентов. Разрешаем ровно источники Telegram через frame-ancestors.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://telegram.org; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'; frame-ancestors https://web.telegram.org https://*.telegram.org https://telegram.org" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;

    # Живость для docker healthcheck и для выката. default_type вместо add_header —
    # чтобы не сбить заголовки безопасности на этом маршруте.
    location = /healthz {
        access_log off;
        default_type application/json;
        return 200 '{"ok":true}';
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
